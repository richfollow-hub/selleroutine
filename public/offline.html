<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오프라인 안내 | 셀러루틴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.03);
      max-w: 400px;
      width: 100%;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #f1f5f9;
      color: #64748b;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 900;
      margin: 0 0 12px;
      color: #0f172a;
    }
    p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <!-- Simple SVG representing WiFi Disconnected -->
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.83-2.84M8.66 8.66a15.24 15.24 0 0 1 12.68 2.54M5 8.66A15.42 15.42 0 0 1 6.8 7.5M10.95 5.05a19.64 19.64 0 0 1 8.81 2.22M1.05 5.05a19.42 19.42 0 0 1 5.86-2.5M12 20h.01"/></svg>
    </div>
    <h1>네트워크 연결 없음</h1>
    <p>
      현재 네트워크 연결이 오프라인 상태입니다.<br>
      인터넷 연결을 확인하고 다시 시도해보세요.
    </p>
    <button class="btn" onclick="window.location.reload()">다시 연결하기</button>
  </div>
</body>
</html>
