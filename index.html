            const baseDate = new Date(baseDateStr);
            const dayOfWeek = baseDate.getDay(); // 0 is Sunday, 1 is Monday...
            const adjustedDay = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
            
            const monday = new Date(baseDate);
            monday.setDate(baseDate.getDate() - adjustedDay);
            
            const week = [];
            for (let i = 0; i < 7; i++) {
                const day = new Date(monday);
                day.setDate(monday.getDate() + i);
                week.push(day);
            }
            return week;

                } catch (error) {
                    console.error(error);

                let count = 0;
                let checkDate = new Date();

                let currentTodayStr = getFormattedDateStr(checkDate);
                const hasCompletedToday = missionLogs.some(l => l.user_id === profile?.id && l.log_date === currentTodayStr && l.is_completed);
                
                if (!hasCompletedToday) {
                    checkDate.setDate(checkDate.getDate() - 1);
                    let yesterdayStr = getFormattedDateStr(checkDate);
                    const hasCompletedYesterday = missionLogs.some(l => l.user_id === profile?.id && l.log_date === yesterdayStr && l.is_completed);
                    if (!hasCompletedYesterday) {
                        return 0;
                    }
                }
                
                while (true) {
                    let dateStr = getFormattedDateStr(checkDate);
                    const hasLogged = missionLogs.some(l => l.user_id === profile?.id && l.log_date === dateStr && l.is_completed);
                    if (hasLogged) {
                        count++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else {
                        break;

                return count;

                        const totalMissions = myMissions.length;
                        const dailyProgress = totalMissions > 0 ? (completedCount / totalMissions) * 100 : 0;

                        totalDaysEvaluated++;

                                                        ) : (
                                                            keywordNotes.map(kw => (
                                                                <div key={kw.id} className="p-4 bg-white border border-slate-100 rounded-2xl shadow-sm relative group animate-fade-in">
                                                                    <button 
                                                                        onClick={() => deleteKeywordNote(kw.id)}
                                                                        className="absolute right-4 top-4 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                                                                    >
                                                                        <Icon name="x" size={14} />
                                                                    </button>
                                                                    <h4 className="text-xs font-black text-indigo-600 mb-2">#{kw.main_keyword}</h4>
                                                                    {kw.longtail_keywords && (
                                                                        <div className="mb-2">
                                                                            <span className="text-[9px] font-bold text-slate-400 block mb-0.5">롱테일 키워드군:</span>
                                                                            <p className="text-[10px] text-slate-600 font-semibold">{kw.longtail_keywords}</p>
                                                                        </div>
                                                                    )}
                                                                    {kw.memo && <p className="text-[10px] text-slate-400 bg-slate-50 p-2.5 rounded-xl mt-1">{kw.memo}</p>}
                                                                </div>
                                                            ))
                                                        )}
                                                    </div>
                                                </Card>
                                            </div>
                                        )}

                                        {/* TAB 4: SUPPLEMENTARY CHECKLIST */}
                                        {activeTab === 'registration' && (
                                            <div className="space-y-6">
                                                {/* Supplementary checklists */}
                                                <Card title="상품 등록 체크리스트" icon={<Icon name="clipboard-check" />}>
                                                    <div className="space-y-2">
                                                        {regTasks.map(task => (
                                                            <div 
                                                                key={task.id}
                                                                onClick={() => toggleRegTask(task.id)}
                                                                className={`flex items-center p-3 rounded-xl border cursor-pointer transition-all ${task.completed ? 'bg-emerald-50 border-emerald-100 text-emerald-600 font-semibold' : 'bg-white border-slate-100 hover:border-slate-200'}`}
                                                            >
                                                                <Icon name={task.completed ? "check-circle" : "circle"} size={16} className="mr-3" />
                                                                <span className="text-xs">{task.text}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </Card>

                                                <Card title="데일리 쇼핑몰 운영 할 일" icon={<Icon name="briefcase" />}>
                                                    <div className="space-y-2">
                                                        {dailyTasks.map(task => (
                                                            <div 
                                                                key={task.id}
                                                                onClick={() => toggleDailyTask(task.id)}
                                                                className={`flex items-center p-3 rounded-xl border cursor-pointer transition-all ${task.completed ? 'bg-emerald-50 border-emerald-100 text-emerald-600 font-semibold' : 'bg-white border-slate-100 hover:border-slate-200'}`}
                                                            >
                                                                <Icon name={task.completed ? "check-circle" : "circle"} size={16} className="mr-3" />
                                                                <span className="text-xs">{task.text}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </Card>
                                            </div>
                                        )}

                                    </main>

                                    {/* Bottom Navigation */}
                                    <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 border-t border-slate-100 py-3 px-6 flex justify-between items-center z-[500] shadow-2xl">
                                        <button 
                                            onClick={() => setActiveTab('daily')}
                                            className={`flex flex-col items-center gap-1 ${activeTab === 'daily' ? 'text-indigo-600 font-black' : 'text-slate-400'}`}
                                        >
                                            <Icon name="calendar" size={20} />
                                            <span className="text-[10px]">인증 루틴</span>
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('ideas')}
                                            className={`flex flex-col items-center gap-1 ${activeTab === 'ideas' ? 'text-indigo-600 font-black' : 'text-slate-400'}`}
                                        >
                                            <Icon name="lightbulb" size={20} />
                                            <span className="text-[10px]">아이디어</span>
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('keywords')}
                                            className={`flex flex-col items-center gap-1 ${activeTab === 'keywords' ? 'text-indigo-600 font-black' : 'text-slate-400'}`}
                                        >
                                            <Icon name="hash" size={20} />
                                            <span className="text-[10px]">키워드</span>
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('registration')}
                                            className={`flex flex-col items-center gap-1 ${activeTab === 'registration' ? 'text-indigo-600 font-black' : 'text-slate-400'}`}
                                        >
                                            <Icon name="check-circle" size={20} />
                                            <span className="text-[10px]">등록체크</span>
                                        </button>
                                    </nav>
                                </div>
                            )}

                            {/* --- OPERATOR / ADMIN VIEW --- */}
                            {profile?.role === 'operator' && (
                                <div className="flex-1 flex flex-col">
                                    <header className="p-6 pt-8 bg-white shadow-sm border-b border-slate-100">
                                        <div className="flex justify-between items-center mb-6">
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <h1 className="text-2xl font-black text-slate-900 tracking-tight">셀러루틴</h1>
                                                    <Badge color="indigo">운영마스터 👑</Badge>
                                                </div>
                                                <p className="text-xs text-indigo-600 font-semibold mt-1">챌린지 기수 및 피드백 통합 관리</p>
                                            </div>
                                            <button 
                                                onClick={handleSignOut}
                                                className="w-10 h-10 bg-slate-100 hover:bg-red-50 hover:text-red-500 text-slate-600 rounded-xl flex items-center justify-center transition-all"
                                            >
                                                <Icon name="log-out" size={18} />
                                            </button>
                                        </div>

                                        {/* Dashboard Navigation Tabs */}
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => setActiveTab('challenges')}
                                                className={`flex-1 py-2 px-3 rounded-xl text-xs font-black transition-all ${activeTab === 'challenges' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-150' : 'bg-slate-100 text-slate-600'}`}
                                            >
                                                기수 챌린지 및 미션 관리
                                            </button>
                                            <button 
                                                onClick={() => setActiveTab('feedbacks')}
                                                className={`flex-1 py-2 px-3 rounded-xl text-xs font-black transition-all ${activeTab === 'feedbacks' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-150' : 'bg-slate-100 text-slate-600'}`}
                                            >
                                                참가자 인증 및 피드백
                                            </button>
                                        </div>
                                    </header>

                                    <main className="p-6 flex-grow pb-24">
                                        
                                        {/* OPERATOR TAB 1: CHALLENGES & MISSIONS */}
                                        {activeTab === 'challenges' && (
                                            <div className="space-y-6">
                                                
                                                {/* Create Challenge Form */}
                                                <Card title="신규 챌린지 기수 개설" icon={<Icon name="plus-circle" />}>
                                                    <div className="space-y-3">
                                                        <input 
                                                            type="text" 
                                                            value={newChallengeTitle}
                                                            onChange={(e) => setNewChallengeTitle(e.target.value)}
                                                            placeholder="기수 챌린지 이름 (예: 셀러루틴 2기)..." 
                                                            className="w-full text-xs p-3 border border-slate-200 rounded-xl bg-slate-50 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                                        />
                                                        <textarea 
                                                            value={newChallengeDesc}
                                                            onChange={(e) => setNewChallengeDesc(e.target.value)}
                                                            placeholder="챌린지 핵심 목표 설명..." 
                                                            className="w-full text-xs p-3 border border-slate-200 rounded-xl bg-slate-50 focus:outline-none focus:ring-1 focus:ring-indigo-500 h-16 resize-none"
                                                        />
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <div>
                                                                <label className="text-[9px] font-bold text-slate-400 block mb-0.5">시작 일자</label>
                                                                <input 
                                                                    type="date" 
                                                                    value={newChallengeStart}
                                                                    onChange={(e) => setNewChallengeStart(e.target.value)}
                                                                    className="w-full text-xs p-2 border border-slate-200 rounded-lg bg-slate-50 focus:outline-none"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="text-[9px] font-bold text-slate-400 block mb-0.5">종료 일자</label>
                                                                <input 
                                                                    type="date" 
                                                                    value={newChallengeEnd}
                                                                    onChange={(e) => setNewChallengeEnd(e.target.value)}
                                                                    className="w-full text-xs p-2 border border-slate-200 rounded-lg bg-slate-50 focus:outline-none"
                                                                />
                                                            </div>
                                                        </div>
                                                        <button 
                                                            onClick={handleAddChallenge}
                                                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-2.5 rounded-xl text-xs transition-all"
                                                        >
                                                            신규 챌린지 운영 모집 시작
                                                        </button>
                                                    </div>
                                                </Card>

                                                {/* Created Challenge List & Custom Missions CRUD */}
                                                <Card title="챌린지 기수별 미션 편집" icon={<Icon name="settings" />}>
                                                    <div className="space-y-4">
                                                        <div>
                                                            <label className="text-[10px] font-bold text-slate-400 block mb-1">대상 챌린지 기수 선택</label>
                                                            <select 
                                                                value={selectedChallengeForMissions}
                                                                onChange={(e) => setSelectedChallengeForMissions(Number(e.target.value))}
                                                                className="w-full text-xs p-3 border border-slate-200 rounded-xl bg-slate-50 focus:outline-none"
                                                            >
                                                                {challenges.map(c => (
                                                                    <option key={c.id} value={c.id}>{c.title} ({c.status === 'ongoing' ? '진행 중' : '진행 대기'})</option>
                                                                ))}
                                                            </select>
                                                        </div>

                                                        <div className="border-t border-slate-100 pt-4 space-y-3">
                                                            <h4 className="text-xs font-black text-slate-800">미션 리스트</h4>
                                                            <div className="space-y-2">
                                                                {missions.filter(m => m.challenge_id === selectedChallengeForMissions).map(m => (
                                                                    <div key={m.id} className="flex justify-between items-center p-3 bg-slate-50 border border-slate-200/50 rounded-xl">
                                                                        <div>
                                                                            <span className="text-xs font-bold text-slate-700 block">{m.title}</span>
                                                                            <span className="text-[9px] text-slate-400">{m.description}</span>
                                                                        </div>
                                                                        <button 
                                                                            onClick={() => handleDeleteOperatorMission(m.id)}
                                                                            className="text-slate-300 hover:text-red-500 transition-colors"
                                                                        >
                                                                            <Icon name="trash" size={14} />
                                                                        </button>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>

                                                        {/* Add mission inline */}
                                                        <div className="border-t border-slate-100 pt-4 space-y-2">
                                                            <h4 className="text-xs font-black text-slate-800">새 미션(습관) 추가</h4>
                                                            <input 
                                                                type="text" 
                                                                value={newMissionTitle}
                                                                onChange={(e) => setNewMissionTitle(e.target.value)}
                                                                placeholder="습관 이름 (예: 경쟁사 5개 분석)..." 
                                                                className="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-none"
                                                            />
                                                            <input 
                                                                type="text" 
                                                                value={newMissionDesc}
                                                                onChange={(e) => setNewMissionDesc(e.target.value)}
                                                                placeholder="실천 방식 세부 가이드..." 
                                                                className="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-none"
                                                            />
                                                            <select 
                                                                value={newMissionLink}
                                                                onChange={(e) => setNewMissionLink(e.target.value)}
                                                                className="w-full text-xs p-3 border border-slate-200 rounded-xl bg-slate-50 focus:outline-none"
                                                            >
                                                                <option value="">탭 연동 없음</option>
                                                                <option value="ideas">아이디어 저장소 연결</option>
                                                                <option value="keywords">키워드 사전 연결</option>
                                                                <option value="registration">등록 체크리스트 연결</option>
                                                            </select>
                                                            <button 
                                                                onClick={handleAddOperatorMission}
                                                                className="w-full bg-slate-800 hover:bg-slate-900 text-white font-extrabold py-2.5 rounded-xl text-xs transition-all"
                                                            >
                                                                기수에 새 습관 탑재하기
                                                            </button>
                                                        </div>
                                                    </div>
                                                </Card>
                                            </div>
                                        )}

                                        {/* OPERATOR TAB 2: MEMBERS & FEEDBACKS */}
                                        {activeTab === 'feedbacks' && (
                                            <div className="space-y-6">
                                                
                                                {/* Inactive Risk Red Board (3+ Days Inactive) */}
                                                {inactiveParticipants.length > 0 && (
                                                    <div className="p-4 bg-rose-50 border border-rose-100 rounded-2xl shadow-sm animate-pulse-once">
                                                        <div className="flex gap-2 items-center text-rose-800 mb-2 font-black text-xs">
                                                            <Icon name="alert-triangle" size={16} />
                                                            <span>실행 부진 챌린저 경고 보드 (3일 이상 미인증)</span>
                                                        </div>
                                                        <div className="space-y-1.5">
                                                            {inactiveParticipants.map(p => (
                                                                <div key={p.id} className="flex justify-between items-center text-[10px] text-rose-700 bg-white/60 p-2 rounded-lg">
                                                                    <span className="font-extrabold">{p.name} ({p.email})</span>
                                                                    <span className="px-1.5 py-0.5 bg-rose-200 text-rose-800 rounded font-black text-[9px]">3일 이상 미인증 🚨</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {/* All Participant Certification Feedbacks */}
                                                <Card title="기수 참가자 인증 심사 및 피드백" icon={<Icon name="users" />}>
                                                    <div className="space-y-4">
                                                        {allParticipants.map(p => {
                                                            const pLogs = missionLogs.filter(l => l.user_id === p.id && l.log_date === selectedDate);
                                                            const pCompletedLogs = pLogs.filter(l => l.is_completed);
                                                            
                                                            // Calculate weekly rate
                                                            const weekDone = missionLogs.filter(l => l.user_id === p.id && l.is_completed).length;
                                                            const weekTotalMissions = myMissions.length * 7;
                                                            const weeklyRate = weekTotalMissions > 0 ? Math.round((weekDone / weekTotalMissions) * 100) : 0;

                                                            return (
                                                                <div key={p.id} className="p-4 bg-white border border-slate-100 rounded-2xl shadow-sm space-y-3">
                                                                    <div className="flex justify-between items-center">
                                                                        <div>
                                                                            <h4 className="text-xs font-black text-slate-800">{p.name}</h4>
                                                                            <p className="text-[9px] text-slate-400">{p.email}</p>
                                                                        </div>
                                                                        <div className="text-right">
                                                                            <Badge color="indigo">주간 {weeklyRate}% 달성</Badge>
                                                                            <p className="text-[9px] text-slate-400 mt-1">오늘 {pCompletedLogs.length}/{myMissions.length} 실천</p>
                                                                        </div>
                                                                    </div>

                                                                    {/* Logs detail expander */}
                                                                    <div className="bg-slate-50 p-3 rounded-xl space-y-2.5">
                                                                        <span className="text-[9px] font-black text-slate-400 block border-b border-slate-200/50 pb-1">
                                                                            {selectedDate} 실천 자료 검토
                                                                        </span>
                                                                        {pLogs.length === 0 ? (
                                                                            <p className="text-[10px] text-slate-400 py-1 text-center">오늘 등록된 실천 기록이 없습니다.</p>
                                                                        ) : (
                                                                            pLogs.map(log => {
                                                                                const missionName = missions.find(m => m.id === log.mission_id)?.title || '챌린지 미션';
                                                                                const feedback = feedbacks.find(f => f.mission_log_id === log.id);

                                                                                return (
                                                                                    <div key={log.id} className="text-[10px] space-y-1 bg-white p-2 rounded-lg shadow-sm border border-slate-200/20">
                                                                                        <div className="flex justify-between items-center">
                                                                                            <span className="font-extrabold text-slate-700">✓ {missionName}</span>
                                                                                            {log.is_completed ? (
                                                                                                <span className="text-[8px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.2 rounded">완료</span>
                                                                                            ) : (
                                                                                                <span className="text-[8px] bg-slate-200 text-slate-600 font-bold px-1.5 py-0.2 rounded">대기</span>
                                                                                            )}
                                                                                        </div>
                                                                                        {log.note && <p className="text-slate-600"><span className="text-slate-400 font-bold">인증:</span> {log.note}</p>}
                                                                                        {log.proof_link && (
                                                                                            <p>
                                                                                                <span className="text-slate-400 font-bold">링크:</span>{' '}
                                                                                                <a href={log.proof_link} target="_blank" rel="noopener noreferrer" className="text-indigo-600 hover:underline font-semibold">
                                                                                                    자료 열기
                                                                                                </a>
                                                                                            </p>
                                                                                        )}
                                                                                        {log.reflection && <p className="text-indigo-700 bg-indigo-50/50 p-1.5 rounded-lg text-[9px] leading-relaxed mt-1">{log.reflection}</p>}

                                                                                        {/* Inline Feedback Form */}
                                                                                        <div className="mt-2 pt-2 border-t border-slate-100 space-y-2">
                                                                                            {feedback ? (
                                                                                                <p className="text-amber-800 bg-amber-50 p-2 rounded-lg"><span className="font-bold">💬 남긴 피드백:</span> {feedback.comment}</p>
                                                                                            ) : (
                                                                                                <div className="flex gap-2">
                                                                                                    <input 
                                                                                                        type="text" 
                                                                                                        placeholder="피드백 작성..." 
                                                                                                        onChange={(e) => {
                                                                                                            setSelectedLogForFeedback(log);
                                                                                                            setOperatorComment(e.target.value);
                                                                                                        }}
                                                                                                        className="flex-1 text-[9px] p-2 border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                                                                                    />
                                                                                                    <button 
                                                                                                        onClick={() => {
                                                                                                            setSelectedLogForFeedback(log);
                                                                                                            handleSaveOperatorFeedback();
                                                                                                        }}
                                                                                                        className="px-2 py-1 bg-indigo-600 text-white rounded font-bold text-[9px]"
                                                                                                    >
                                                                                                        보내기
                                                                                                    </button>
                                                                                                </div>
                                                                                            )}
                                                                                        </div>
                                                                                    </div>
                                                                                );
                                                                            })
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </Card>
                                            </div>
                                        )}
                                    </main>
                                </div>
                            )}

                        </div>
                    )}

                    {/* --- MISSION DETAIL ENTRY MODAL (참가자용) --- */}
                    {selectedMission && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[1000] flex items-end justify-center p-4 animate-fade-in" onClick={() => setSelectedMission(null)}>
                            <div className="bg-white rounded-t-3xl w-full max-w-md p-6 shadow-2xl space-y-4 pb-8" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                    <div>
                                        <h3 className="text-sm font-black text-slate-800">{selectedMission.title}</h3>
                                        <p className="text-[10px] text-slate-400 mt-0.5">{selectedMission.description}</p>
                                    </div>
                                    <button onClick={() => setSelectedMission(null)} className="text-slate-400">
                                        <Icon name="x" size={18} />
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    <div>
                                        <label className="text-[10px] font-black text-slate-500 block mb-1">한 줄 실행 기록 (Note)</label>
                                        <input 
                                            type="text" 
                                            value={missionNote}
                                            onChange={(e) => setMissionNote(e.target.value)}
                                            placeholder="실천한 세부 결과나 성과를 기록해주세요 (예: 리서치 완료)..." 
                                            className="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-500 block mb-1">인증 증빙 링크 (Proof Link)</label>
                                        <input 
                                            type="url" 
                                            value={missionProofLink}
                                            onChange={(e) => setMissionProofLink(e.target.value)}
                                            placeholder="블로그 후기, 노션 정리, 이미지 드라이브 링크 등..." 
                                            className="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                        />
                                    </div>
                                </div>

                                <button 
                                    onClick={submitDetailedCertification}
                                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 rounded-xl text-xs transition-all"
                                >
                                    인증 제출 및 할 일 체크 완료
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
